name: ci
on: [push, pull_request]
jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      # Deterministic layer only; the judge layers run inside Claude Code, not in CI.
      - run: pip install pytest && pytest -q tests
      - run: python evals/run.py evals/cases.jsonl --strict
  trust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - uses: vishalhabib99/mcp-trust-check@v1
        with:
          path: .
          run: "retirement-answer-check"
          fail-on: block
